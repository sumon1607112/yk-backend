name: Build and deploy ASP.Net Core app to Azure Web App - yk-auth-api

on:
  push:
    branches:
      - main
    paths:
      - 'ServiceApplications/Auth/**'
      - 'Aspire/YK/YK.ServiceDefaults/**'
      - '.github/workflows/deploy-prod-yk-auth-api.yml'
  workflow_dispatch:

env:
  PROJECT_PATH: ServiceApplications/Auth/Presentation/YK.Auth.WebAPI/YK.Auth.WebAPI.csproj
  PUBLISH_DIR: ./publish

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore "${{ env.PROJECT_PATH }}"

      - name: Build
        run: dotnet build "${{ env.PROJECT_PATH }}" --configuration Release --no-restore

      - name: Publish
        run: dotnet publish "${{ env.PROJECT_PATH }}" --configuration Release --no-build --output "${{ env.PUBLISH_DIR }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: auth-api
          path: ${{ env.PUBLISH_DIR }}

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: auth-api
          path: ./publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_YK_AUTH_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_YK_AUTH_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_YK_AUTH_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: yk-auth-api
          slot-name: Production
          package: ./publish
