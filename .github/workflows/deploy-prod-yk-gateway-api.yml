name: Build and deploy ASP.Net Core app to Azure Web App - yk-gateway-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_PATH: APIGateway/YK.APIGateway/YK.APIGateway.csproj
  PUBLISH_DIR: ./publish

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore "${{ env.PROJECT_PATH }}"

      - name: Build
        run: dotnet build "${{ env.PROJECT_PATH }}" --configuration Release --no-restore

      - name: Publish
        run: dotnet publish "${{ env.PROJECT_PATH }}" --configuration Release --no-build --output "${{ env.PUBLISH_DIR }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gateway-api
          path: ${{ env.PUBLISH_DIR }}

  deploy:
    runs-on: windows-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: gateway-api
          path: ./publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_YK_GATEWAY_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_YK_GATEWAY_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_YK_GATEWAY_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: yk-gateway-api
          slot-name: Production
          package: ./publish
